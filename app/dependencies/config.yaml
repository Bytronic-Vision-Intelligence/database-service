# Broker connections  ---------------------------------------
mqtt:
  mqtt_ip: localhost
  mqtt_port: 1883

# Database connections ---------------------------------------
database:
  - database_name: churchill_database
    file_location: "../data/databases/test_database.db"
    search_threshold: 20
    tables:
      - sku_table
      - results_table

# MQTT options ---------------------------------------
topics:
  - name: "add_to_table"
    topic: "churchill/db/add/sku_data"
    is_subscribe: True
    is_trigger: True

  - name: "search_table"
    topic: "churchill/db/search/sku_data"
    is_subscribe: True
    is_trigger: True

  - name: "database_output"
    topic: "churchil/db/search/matching_sku"
    is_subscribe: False
    is_trigger: False

  - name: "depth_data"
    topic: "churchil/depth_camera/image/depth_image"
    is_subscribe: True
    is_trigger: False

  - name: "colour_data"
    topic: "churchil/colour_camera/image/colour_image"
    is_subscribe: True
    is_trigger: False

image_options:
  region_of_interest: [0,0,2500,3000]
  trim_value: 0.0325
 
database_options:
  database_name: "test_database"
  database_table: "test_table"