# Broker connections  ---------------------------------------
broker_details:
  mqtt_ip: localhost
  mqtt_port: 1883

# Database connections ---------------------------------------
database: [
  {
    file_location: "database/churchill_database.db",
    database_name: "churchill_database",
    search_threshold: 20,
    tables: [
      {
        churchill_sku_table: "sku_table"
      }
    ]
  }
]

# Frame storage -----------------------------------------------
# Captured frames are written here and only their path is stored, so the
# .db stays small and retention is a file sweep.
image_store: "database/images"
frames_table: "frames"
results_table: "results"

# MQTT options ---------------------------------------
topics: [
  {
    name: "add_to_table",
    topic: "churchill/db/add/sku_data",
    is_subscribe: True,
    is_trigger: True
  },
  {
    name: "search_table",
    topic: "churchill/db/search/sku_data",
    is_subscribe: True,
    is_trigger: True
  },
  {
    name: "database_output",
    topic: "churchil/db/search/matching_sku",
    is_subscribe: False,
    is_trigger: False
  },
  {
    name: "depth_data",
    topic: "churchil/depth_camera/image/depth_image",
    is_subscribe: True,
    is_trigger: False
  },
  {
    name: "colour_data",
    topic: "churchil/colour_camera/image/colour_image",
    is_subscribe: True,
    is_trigger: False
  }
  ,
  {
    name: "save_frame",
    topic: "project/db/frame/save",
    is_subscribe: True,
    is_trigger: True
  },
  {
    name: "frame_ack",
    topic: "project/db/frame/saved",
    is_subscribe: False,
    is_trigger: False
  }
  ,
  {
    name: "save_result",
    topic: "project/db/result/save",
    is_subscribe: True,
    is_trigger: True
  },
  {
    name: "result_ack",
    topic: "project/db/result/saved",
    is_subscribe: False,
    is_trigger: False
  }
]
