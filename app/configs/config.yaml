mqtt:
  mqtt_ip: localhost
  mqtt_port: 1883
database:
- database_name: churchill_database
  file_location: ../data/databases/test_database.db
  search_threshold: 20
  tables:
  - sku_table
  - results_table
topics:
- name: add_to_table
  topic: churchill/database/add/sku_data
  is_subscribe: true
  is_trigger: true
- name: search_table
  topic: churchill/database/search/sku_data
  is_subscribe: true
  is_trigger: true
- name: database_output
  topic: churchill/database/search/matching_sku
  is_subscribe: false
  is_trigger: false
- name: depth_data
  topic: churchill/camera/depth/image
  is_subscribe: true
  is_trigger: false
- name: colour_data
  topic: churchill/camera/colour/image
  is_subscribe: true
  is_trigger: false
