# Broker connections  ---------------------------------------
broker_details:
  mqtt_ip: localhost
  mqtt_port: 1883

# Database connections ---------------------------------------
database: [
  {
    db_host_address: "127.0.0.1",
    user: "root",
    password: "root",
    database_name: "churchill_database",
    tables: [
      {
        churchill_sku_table: "sku_table"
      }
    ]
  }
]

# MQTT options ---------------------------------------
topics: [
  {
    name: "add_to_table",
    topic: "churchill/db/add/sku_data",
    is_subscribe: True,
    is_trigger: True
  },
  {
    name: "search_table",
    topic: "churchill/db/search/sku_data",
    is_subscribe: True,
    is_trigger: True
  },
  {
    name: "database_output",
    topic: "churchil/db/search/matching_sku",
    is_subscribe: False,
    is_trigger: False
  },
  {
    name: "depth_data",
    topic: "churchil/depth_camera/image/depth_image",
    is_subscribe: True,
    is_trigger: False
  },
  {
    name: "colour_data",
    topic: "churchil/colour_camera/image/colour_image",
    is_subscribe: True,
    is_trigger: False
  }
]